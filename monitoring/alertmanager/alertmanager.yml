global:
  resolve_timeout: 1m

route:
  receiver: sentinelops-recovery
  group_by: ["alertname", "service"]
  group_wait: 2s
  group_interval: 10s
  repeat_interval: 1m

receivers:
  - name: sentinelops-recovery
    webhook_configs:
      - url: "http://recovery-controller:5002/alerts"
        send_resolved: false
